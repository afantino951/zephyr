include: base.yaml

properties:
  cpu:
    type: phandle
    required: true
    description: |
      Phandle to the /cpus/cpu* node this node brings up.

  execution-memory:
    type: phandle
    description: |
      Phandle to the memory region or partition from which the secondary CPU executes.

  source-memory:
    type: phandle
    description: |
      Phandle to the memory region or partition from which the secondary CPU's image is
      copied into execution-memory.
